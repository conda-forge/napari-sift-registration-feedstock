{% set name = "napari-sift-registration" %}
{% set version = "0.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/napari-sift-registration-{{ version }}.tar.gz
  sha256: 349cf97344e920f816b6896e1f21b5cdd1ca695506fd8a132576d0bfad51e5f9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - magicgui
    - napari
    - numpy
    - python >={{ python_min }}
    - qtpy
    - scikit-image

test:
  imports:
    - napari_sift_registration
  commands:
    - pip list
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jfozard/napari-sift-registration
  summary: Simple plugin for SIFT keypoint detection, and affine registration with RANSAC, based on scikit-image
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - goanpeca
    - jaimergp
